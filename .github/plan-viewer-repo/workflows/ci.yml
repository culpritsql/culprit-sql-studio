name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify package, digests, and React SSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install peer runtime for SSR verification
        if: hashFiles('pkg/index.js') != ''
        run: npm install --no-save --no-package-lock react@19 react-dom@19 lucide-react@1.68.0
      - name: Verify manifest, digests, CSS isolation, and React components
        run: node test/smoke.mjs
      - name: Dry-run npm tarball contents
        if: hashFiles('pkg/index.js') != ''
        run: npm pack --dry-run
