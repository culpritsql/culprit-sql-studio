name: Plan Viewer Package Sync

# Builds, browser-tests, and syncs @culpritsql/plan-viewer to https://github.com/culpritsql/culprit-plan-viewer.
# Skips sync commits when shipped artifacts (.js, .css, models/*.d.ts, README, assets, package.json) did not change.
# Publishes a v<version> tag ONLY when packages/culprit-plan-viewer/package.json has an unreleased version AND pkg/ changed since the previous tag.
on:
  push:
    branches: [main]
    paths:
      - "packages/culprit-plan-viewer/**"
      - "app/src/gen/**"
      - "locales/en.json"
      - "locales/.cldr/**"
      - ".github/plan-viewer-repo/**"
      - ".github/scripts/stage_plan_viewer_repo.py"
      - ".github/workflows/plan-viewer-sync.yml"
      - "dev/build-plan-viewer.py"
      - "dev/smoke-plan-viewer.mjs"
      - "dev/licenses.py"
      - "dev/check-boundaries.py"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Tag v<package.json version> on culpritsql/culprit-plan-viewer to publish to npm"
        required: false
        type: boolean
        default: false
      force_initial_tag:
        description: "Allow tagging even if pkg/ matches main (use only for initial v0.5.6 release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plan-viewer-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Select sync source
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.select.outputs.should_run }}
      sha: ${{ steps.select.outputs.sha }}
      pkg_version: ${{ steps.select.outputs.pkg_version }}
      want_tag: ${{ steps.select.outputs.want_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        name: Check package version and existing release tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PUBLISH_INPUT: ${{ inputs.publish_release }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          event = os.environ["EVENT_NAME"]
          ref = os.environ["EVENT_REF"]
          publish_input = os.environ.get("PUBLISH_INPUT", "").lower() == "true"
          is_tag_push = event == "push" and ref.startswith("refs/tags/v")

          pkg_version = json.loads(Path("packages/culprit-plan-viewer/package.json").read_text())["version"]
          target_tag = f"v{pkg_version}"

          tag_exists = (
              subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      "--exit-code",
                      "--tags",
                      "https://github.com/culpritsql/culprit-plan-viewer.git",
                      f"refs/tags/{target_tag}",
                  ],
                  capture_output=True,
              ).returncode
              == 0
          )

          want_tag = is_tag_push or publish_input
          should_run = True
          if is_tag_push and tag_exists:
              print(f"{target_tag} is already released on culpritsql/culprit-plan-viewer; skipping desktop-only tag push.")
              should_run = False
              want_tag = False

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"should_run={'true' if should_run else 'false'}\n"
                  f"sha={sha}\n"
                  f"pkg_version={pkg_version}\n"
                  f"want_tag={'true' if want_tag else 'false'}\n"
              )
          print(f"should_run={should_run} pkg_version={pkg_version} want_tag={want_tag} tag_exists={tag_exists}")
          PY

  sync:
    name: Build, verify, and sync @culpritsql/plan-viewer
    if: needs.changes.outputs.should_run == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: standalone-wasm-english
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install the exact verified wasm-bindgen CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  %s\n' "$archive" | sha256sum --check
          tool="$RUNNER_TEMP/wasm-bindgen-0.2.129"
          mkdir -p "$tool"
          tar -xzf "$archive" --strip-components=1 -C "$tool"
          test "$("$tool/wasm-bindgen" --version)" = 'wasm-bindgen 0.2.129'
          echo "WASM_BINDGEN=$tool/wasm-bindgen" >> "$GITHUB_ENV"
      - name: Configure the Ubuntu package mirror
        run: sudo python3 .github/scripts/configure_ubuntu_mirror.py
      - name: Install frozen UI tools and Chromium
        timeout-minutes: 15
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps --only-shell chromium
      - name: Install shared license tooling
        uses: ./.github/actions/install-cargo-about
      - name: Generate shared third-party notices
        run: python3 -B dev/licenses.py
      - name: Build @culpritsql/plans WebAssembly parser for browser verification
        run: python3 -B dev/build-wasm.py --bindgen "$WASM_BINDGEN"
      - name: Build @culpritsql/plan-viewer React package
        run: python3 -B dev/build-plan-viewer.py
      - name: Verify closed distribution and model digests
        run: python3 -B dev/check-boundaries.py --plan-viewer-artifacts
      - name: Run Chromium browser smoke suite
        run: node dev/smoke-plan-viewer.mjs > target/plan-viewer-browser-smoke.json
      - name: Stage public @culpritsql/plan-viewer repository
        run: |
          STAGE_PARENT="$RUNNER_TEMP/pv-stage"
          mkdir -p "$STAGE_PARENT"
          ln -s "$GITHUB_WORKSPACE/app/node_modules" "$STAGE_PARENT/node_modules"
          python3 -B .github/scripts/stage_plan_viewer_repo.py --omit-workflows "$STAGE_PARENT/repo"
          node "$STAGE_PARENT/repo/test/smoke.mjs" --require-pkg
      - name: Upload staged npm package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: culprit-plan-viewer-staged
          path: ${{ runner.temp }}/pv-stage/repo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Sync changed artifacts and release tag when pkg/ changed
        env:
          DEDICATED_TOKEN: ${{ secrets.CULPRIT_PLAN_VIEWER_SYNC_TOKEN }}
          SHARED_TOKEN: ${{ secrets.CULPRIT_PLANS_SYNC_TOKEN }}
          SOURCE_SHA: ${{ needs.changes.outputs.sha }}
          PKG_VERSION: ${{ needs.changes.outputs.pkg_version }}
          WANT_TAG: ${{ needs.changes.outputs.want_tag }}
          FORCE_INITIAL: ${{ inputs.force_initial_tag }}
        run: |
          set -euo pipefail
          SYNC_TOKEN="${DEDICATED_TOKEN:-$SHARED_TOKEN}"
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::Neither CULPRIT_PLAN_VIEWER_SYNC_TOKEN nor CULPRIT_PLANS_SYNC_TOKEN is configured; skipping push."
            exit 0
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"

          git clone --branch main https://github.com/culpritsql/culprit-plan-viewer.git "$RUNNER_TEMP/target-repo"
          git -C "$RUNNER_TEMP/target-repo" fetch --tags origin

          SYNC_DIFF="$(python3 -B "$GITHUB_WORKSPACE/.github/scripts/stage_plan_viewer_repo.py" "$RUNNER_TEMP/pv-stage/repo" --compare-sync "$RUNNER_TEMP/target-repo")"
          SHORT_SHA="${SOURCE_SHA:0:8}"

          cd "$RUNNER_TEMP/target-repo"
          git config user.name "culprit-bot"
          git config user.email "noreply@culpritsql.com"

          if [ "$SYNC_DIFF" = "true" ]; then
            rsync -a --delete --exclude '.git/' --exclude '.github/' "$RUNNER_TEMP/pv-stage/repo/" "$RUNNER_TEMP/target-repo/"
            git add -A
            git commit -m "Sync @culpritsql/plan-viewer from culprit-sql-studio@${SHORT_SHA}"
            git push origin HEAD:main || echo "main has advanced beyond ${SHORT_SHA}; keeping synced commit for tag check"
          else
            echo "No shipped artifacts or sources changed in @culpritsql/plan-viewer; skipping sync commit."
          fi

          if [ "$WANT_TAG" = "true" ]; then
            TARGET_TAG="v${PKG_VERSION}"
            if git rev-parse -q --verify "refs/tags/${TARGET_TAG}" >/dev/null 2>&1; then
              echo "Tag ${TARGET_TAG} already exists on culpritsql/culprit-plan-viewer; skipping."
              exit 0
            fi

            PREV_TAG="$(git tag -l 'v*' --sort=-version:refname | head -n1 || true)"
            if [ -n "$PREV_TAG" ] && [ "${FORCE_INITIAL:-false}" != "true" ]; then
              git worktree add --detach "$RUNNER_TEMP/prev-release" "$PREV_TAG"
              PKG_DIFF="$(python3 -B "$GITHUB_WORKSPACE/.github/scripts/stage_plan_viewer_repo.py" "$RUNNER_TEMP/pv-stage/repo" --compare-pkg "$RUNNER_TEMP/prev-release")"
              git worktree remove --force "$RUNNER_TEMP/prev-release"
              if [ "$PKG_DIFF" != "true" ]; then
                echo "::notice::No pkg/ runtime, style, or model changes since ${PREV_TAG}; skipping npm publish of ${TARGET_TAG}."
                exit 0
              fi
            fi

            git tag -a "$TARGET_TAG" -m "Release @culpritsql/plan-viewer ${PKG_VERSION} (culprit-sql-studio@${SHORT_SHA})"
            git push origin "refs/tags/${TARGET_TAG}"
          fi
