name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token, no secrets; third-party actions are pinned to commit SHAs (the comment says which tag).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tests never touch an OS keychain: secrets stay in memory.
  CULPRIT_KEYCHAIN: "off"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Python tooling and translation freshness
        run: |
          python3 -B -m unittest discover -s dev -p test_catalog.py
          python3 -B -m unittest discover -s dev -p test_smoke_providers.py
          python3 -B -m unittest discover -s dev -p test_mysql_replication_fixture.py
          python3 -B -m unittest discover -s dev -p test_check_boundaries.py
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 dev/catalog.py stale --check

  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The desktop app crate needs the frontend build and, on Linux, WebKitGTK; the `app` job covers it.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude culprit-app --all-targets -- -D warnings
      - name: Adapter build dependency boundaries
        if: runner.os == 'Linux'
        run: python3 -B dev/check-boundaries.py
      - name: Engine without bundled providers
        run: cargo clippy --locked -p culprit-engine --no-default-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --exclude culprit-app
      # The tests above regenerate app/src/gen from the Rust model: a difference means the committed contracts are stale,
      # even when the old TypeScript still compiles. Once is enough: the generated text doesn't depend on the OS.
      - name: Generated UI contracts match the Rust model
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git diff --exit-code -- app/src/gen
          untracked=$(git ls-files --others --exclude-standard -- app/src/gen)
          if [ -n "$untracked" ]; then
            echo "Generated but not committed:"
            echo "$untracked"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Typecheck, test and lint the UI
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run lint

  wasm:
    name: Standalone parsers (WASM and browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: standalone-wasm-english
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install the exact verified wasm-bindgen CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz"
          # Official immutable release and its published asset digest; no installer or unpinned action.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  %s\n' "$archive" | sha256sum --check
          tool="$RUNNER_TEMP/wasm-bindgen-0.2.129"
          mkdir -p "$tool"
          tar -xzf "$archive" --strip-components=1 -C "$tool"
          test "$("$tool/wasm-bindgen" --version)" = 'wasm-bindgen 0.2.129'
          echo "WASM_BINDGEN=$tool/wasm-bindgen" >> "$GITHUB_ENV"
      - name: Pure normal/build graphs and selected English-only wrapper
        run: python3 -B dev/check-boundaries.py --portable
      - name: Configure the Ubuntu package mirror
        run: sudo python3 .github/scripts/configure_ubuntu_mirror.py
      - name: Existing frozen UI tools and Chromium
        timeout-minutes: 15
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps --only-shell chromium
      - name: Install the shared license tooling
        # Reuse the same generator and pinned local tooling as native release notices.
        # The generator needs the already-frozen app packages above.
        uses: ./.github/actions/install-cargo-about
      - name: Generate the shared native and WebAssembly third-party notices
        run: python3 -B dev/licenses.py
      - name: Build the standalone package with the final-crate stack policy
        run: python3 -B dev/build-wasm.py --bindgen "$WASM_BINDGEN"
      - name: Closed browser distribution and exact generated model digests
        run: python3 -B dev/check-boundaries.py --wasm-artifacts
      - name: Actual packaged browser parse, compare, deadlock, export and refusal controls
        run: node dev/smoke-wasm.mjs > target/wasm-browser-smoke.json
      - name: Keep measured artifacts and browser receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-wasm-prerequisite
          path: |
            packages/culprit-wasm/pkg/
            packages/culprit-wasm/package.json
            packages/culprit-wasm/LICENSE
            packages/culprit-wasm/README.md
            target/wasm-browser-smoke.json
          if-no-files-found: warn
          retention-days: 7

  providers:
    name: Live provider (${{ matrix.fixture }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fixture: postgres, os: ubuntu-latest }
          - { fixture: mysql, os: ubuntu-latest }
          - { fixture: mysql-5.7, os: ubuntu-latest }
          - { fixture: mariadb-10.6, os: ubuntu-latest }
          - { fixture: mariadb-10.11, os: ubuntu-latest }
          - { fixture: mariadb-11.8, os: ubuntu-latest }
          - { fixture: mssql, os: ubuntu-latest }
          # These fixture digests pin the native arm64 images used for provider verification.
          - { fixture: timescale, os: ubuntu-24.04-arm }
          - { fixture: yugabyte, os: ubuntu-24.04-arm }
          - { fixture: yugabyte-cluster, os: ubuntu-24.04-arm }
          - { fixture: ssh, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Collect, restrict permissions and verify cancellation in a disposable database
        env:
          CULPRIT_NATIVE_COST_RECEIPT_DIR: ${{ runner.temp }}/native-provider-cost-receipts
        run: |
          if [ "${{ matrix.fixture }}" = mssql ]; then
            mkdir -m 700 "$CULPRIT_NATIVE_COST_RECEIPT_DIR"
          fi
          python3 -B dev/smoke-providers.py ${{ matrix.fixture }}
      - name: Exercise refused acquisition on its own SQL Server fixture
        if: ${{ !cancelled() && matrix.fixture == 'mssql' }}
        env:
          CULPRIT_NATIVE_COST_RECEIPT_DIR: ${{ runner.temp }}/native-provider-cost-receipts
        run: |
          python3 -B dev/smoke-providers.py mssql --test culprit-mssql \
            conn::native_tests::refused_connection::owned_refused_loopback_preserves_real_admission_and_retires_only_the_sealed_empty_original
      - name: Exercise index catalog scale in a genuinely empty owned database
        if: ${{ !cancelled() && matrix.fixture == 'mssql' }}
        env:
          CULPRIT_NATIVE_COST_RECEIPT_DIR: ${{ runner.temp }}/native-provider-cost-receipts
        run: python3 -B dev/smoke-providers.py mssql-empty-catalog
      - name: Exercise selected database counters in their own native namespace
        if: ${{ !cancelled() && matrix.fixture == 'mssql' }}
        env:
          CULPRIT_NATIVE_COST_RECEIPT_DIR: ${{ runner.temp }}/native-provider-cost-receipts
        run: python3 -B dev/smoke-providers.py mssql-database-counters
      - name: Exercise native full-text metadata and population on its explicit owned installation
        if: ${{ !cancelled() && matrix.fixture == 'mssql' }}
        env:
          CULPRIT_NATIVE_COST_RECEIPT_DIR: ${{ runner.temp }}/native-provider-cost-receipts
        run: python3 -B dev/smoke-providers.py mssql-fulltext
      - name: Keep SQL Server native source and cancellation receipts
        if: always() && matrix.fixture == 'mssql'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-provider-cost-receipts
          path: ${{ runner.temp }}/native-provider-cost-receipts
          if-no-files-found: warn
          retention-days: 7
      # SQL Server Agent's real worker needs a supported native x64 host; metadata success alone is insufficient.
      - name: Capture Agent metadata and genuine failure/success history on native x64
        if: ${{ !cancelled() && matrix.fixture == 'mssql' }}
        timeout-minutes: 12
        env:
          CULPRIT_NATIVE_COST_RECEIPT_DIR: ${{ runner.temp }}/native-agent-job-receipts
        run: |
          test "$(uname -m)" = x86_64
          mkdir -m 700 "$CULPRIT_NATIVE_COST_RECEIPT_DIR"
          # Signal the same supervisor after 300 s, then await its existing bounded, exact-owner cleanup.
          # No kill-after shortcut may drop that cleanup; the step ceiling also covers its three 120 s commands.
          timeout --signal=TERM 300s python3 -B dev/smoke-providers.py mssql-agent \
            --test culprit-mssql jobs::native_tests::owned_agent_metadata_source_roundtrips_without_creating_or_executing_jobs \
            --test culprit-mssql jobs::native_tests::owned_agent_history_keeps_real_failure_success_and_current_definition_separate_on_the_same_reader
      - name: Keep Agent metadata and execution acceptance receipts
        if: always() && matrix.fixture == 'mssql'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-agent-job-receipts
          path: ${{ runner.temp }}/native-agent-job-receipts
          if-no-files-found: warn
          retention-days: 7

  replication:
    name: Native replication (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: PostgreSQL
            fixtures: '["postgres-replication", "postgres-16-replication"]'
            crate: ""
            filter: ""
          - suite: MySQL and MariaDB
            fixtures: '["mysql-replication", "mysql-no-performance-schema", "mariadb-replication", "mariadb-no-performance-schema", "mysql-moving-replication"]'
            crate: ""
            filter: ""
          - suite: SQL Server
            fixtures: '["mssql", "mssql-hadr"]'
            crate: culprit-mssql
            filter: "telemetry::replication::native_tests::"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Native semantics and lifecycle checks; these small fixtures do not qualify production work cost.
      - name: Exercise native replication, visibility, limits and shutdown
        env:
          REPLICATION_FIXTURES: ${{ matrix.fixtures }}
          REPLICATION_CRATE: ${{ matrix.crate }}
          REPLICATION_FILTER: ${{ matrix.filter }}
          CULPRIT_NATIVE_COST_RECEIPT_DIR: ${{ runner.temp }}/native-replication-cost-receipts
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          Path(os.environ["CULPRIT_NATIVE_COST_RECEIPT_DIR"]).mkdir(mode=0o700)
          command = ["python3", "-B", "dev/smoke-providers.py", *json.loads(os.environ["REPLICATION_FIXTURES"])]
          if os.environ["REPLICATION_FILTER"]:
              command += ["--test", os.environ["REPLICATION_CRATE"], os.environ["REPLICATION_FILTER"]]
          subprocess.run(command, check=True)
          PY
      - name: Exercise replication and retained cache populations on the same owned SQL Server AG pair
        if: ${{ !cancelled() && matrix.crate == 'culprit-mssql' }}
        env:
          CULPRIT_NATIVE_COST_RECEIPT_DIR: ${{ runner.temp }}/native-replication-cost-receipts
        run: |
          docker pull --platform linux/amd64 mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
          python3 -B dev/smoke-providers.py mssql-replication
      - name: Keep SQL Server native work and cancellation observations
        if: always() && matrix.crate == 'culprit-mssql'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-replication-cost-receipts
          path: ${{ runner.temp }}/native-replication-cost-receipts
          if-no-files-found: ignore
          retention-days: 7

  telemetry:
    name: Telemetry protocol and warehouse correctness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Blob conditional writes and recovery in an owned Azurite fixture
        run: python3 -B dev/smoke-delivery.py
      # Functional mappings, completion gates, duplicate handling and complete observation sets only.
      # Kusto emulator does not support ARM and its license prohibits benchmarking.
      - name: Execute the production schema, mappings and canonical functions in Kusto
        run: python3 -B dev/smoke-adx.py
      - name: S3 conditional recovery and ClickHouse delivery across restart
        run: python3 -B dev/smoke-s3.py
      - name: Execute ClickHouse delivery, exact receipts and canonical views
        run: python3 -B dev/smoke-clickhouse.py

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories, licenses, duplicate versions and sources, as deny.toml says.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Audit the UI's packages
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun audit
      # The third-party notices the release ships: a dependency whose license can't be read fails here, not on
      # release day.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/install-cargo-about
      - name: Write the third-party notices
        run: python3 dev/licenses.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: target/licenses/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 1

  collector-image:
    name: Collector container (offline)
    # Match the release's glibc baseline; the runtime image uses Debian bookworm.
    runs-on: ubuntu-22.04
    needs: dependencies
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: collector-ubuntu22-rust
          cache-on-failure: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: target/licenses
      - name: Build the Linux collector executable
        run: cargo build --locked --release -p culprit-cli
      - name: Package and verify non-root offline entry points
        run: python3 -B dev/smoke-container.py --binary target/release/culprit

  e2e:
    name: Interface (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Configure the Ubuntu package mirror
        run: sudo python3 .github/scripts/configure_ubuntu_mirror.py
      - name: UI packages and the browser
        timeout-minutes: 15
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps --only-shell chromium
      # The UI in a real browser against the demo: navigation, the editor, findings, schema and plans by keyboard.
      - name: Interaction tests
        working-directory: app
        run: bun run e2e
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: app/test-results/
          retention-days: 7

  coverage:
    name: Coverage
    # Measures, doesn't gate: the table goes to the run's summary, the LCOV reports to an artifact. On pushes to main,
    # so pull requests don't wait for an instrumented build.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
          workspaces: ". -> target/coverage"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: UI packages
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Measure
        run: |
          python3 dev/coverage.py
          cat target/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            target/coverage/rust.lcov
            target/coverage/ui/lcov.info
            target/coverage/summary.md
          retention-days: 14

  app:
    name: Desktop app (${{ matrix.os }})
    needs: [fmt, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo python3 .github/scripts/configure_ubuntu_mirror.py
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build the UI
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build
      # Languages are compiled into the app, never read from disk: every locales/*.json and its keys are in the bundle.
      - name: Every language is inside the built UI
        working-directory: app
        run: bun scripts/check-bundled-locales.ts
      - name: Clippy (desktop app)
        run: cargo clippy --locked -p culprit-app --all-targets -- -D warnings
      # The workspace tests leave the desktop crate out; its own run here, on each platform it ships for.
      - name: Test (desktop app)
        run: cargo test --locked -p culprit-app --lib
      # Unsigned: no certificates or notarization secrets in CI. Local signed builds use dev/build-local.sh.
      - name: Bundle
        working-directory: app
        run: bunx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: culprit-${{ runner.os }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 14
