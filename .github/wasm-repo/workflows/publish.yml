name: Publish

# Publishes @culpritsql/plans to npm via OIDC Trusted Publishing when a v* tag is pushed
# (either synced from culpritsql/culprit-sql-studio or dispatched manually for an existing tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to verify and publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Omit registry-url so setup-node does not inject a placeholder _authToken that blocks npm OIDC.
          node-version: "24"
      - name: Verify release tag matches package version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-${EVENT_REF#refs/tags/}}"
          VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1; }
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify packaged WebAssembly digests and runtime behavior
        run: node test/smoke.mjs --require-pkg
      - name: Inspect npm tarball
        run: npm pack --dry-run
      - name: Publish @culpritsql/plans with OIDC provenance
        run: |
          set -euo pipefail
          if npm view "@culpritsql/plans@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@culpritsql/plans@${PACKAGE_VERSION} is already published on npm; nothing to do."
            exit 0
          fi
          npm publish --access public --provenance
