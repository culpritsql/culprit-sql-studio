[package]
name = "culprit-blob-s3"
description = "S3 conditional object recovery transport with injected signing credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
default = ["write"]
write = ["dep:culprit-collector"]

[dependencies]
culprit-evidence.workspace = true
culprit-auth.workspace = true
culprit-collector = { workspace = true, optional = true }
culprit-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
ureq.workspace = true
zeroize.workspace = true

[dev-dependencies]
culprit-evidence = { workspace = true, features = ["test-support"] }
culprit-store-clickhouse = { workspace = true, features = ["write"] }
tempfile.workspace = true
culprit-collector = { workspace = true, features = ["test-support"] }
