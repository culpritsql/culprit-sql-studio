[package]
name = "culprit-engine"
description = "Culprit's engine: connection store, provider registry, scans and snapshot storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The files in tests/ are modules of one test binary, tests/all.rs.
autotests = false

[lib]
# Its doc comments hold no Rust examples: rustdoc would have nothing to test.
doctest = false

[features]
default = ["mssql", "postgres", "yugabyte", "mysql", "sqlite", "clickhouse", "auth-aws", "auth-azure"]
# Built-in authentication and cloud composition; embedders can supply the existing interfaces independently.
auth-aws = ["dep:culprit-auth-aws"]
auth-azure = ["dep:culprit-auth-azure", "dep:ureq"]
mssql = ["dep:culprit-mssql"]
postgres = ["dep:culprit-postgres"]
yugabyte = ["dep:culprit-yugabyte"]
mysql = ["dep:culprit-mysql"]
sqlite = ["dep:culprit-sqlite"]
clickhouse = ["dep:culprit-clickhouse"]
collector = ["dep:culprit-collector", "evidence"]
evidence = ["dep:culprit-evidence"]
warehouse-adx = ["evidence", "dep:culprit-store-adx"]
warehouse-clickhouse = ["evidence", "dep:culprit-store-clickhouse"]
evidence-azure = ["evidence", "dep:culprit-blob-azure"]
evidence-s3 = ["evidence", "dep:culprit-blob-s3"]
# Explicit ignored-test fixture only. Normal/default/no-default source and desktop dependencies are unchanged.
postgres-native-tests = ["collector", "postgres", "culprit-postgres/native-test-support"]
mysql-native-tests = ["collector", "mysql", "culprit-mysql/native-test-support"]
mssql-native-tests = ["collector", "mssql", "culprit-mssql/native-test-support"]
store-adx = ["collector", "warehouse-adx", "culprit-store-adx/write", "dep:culprit-blob-azure", "culprit-blob-azure/write"]
store-clickhouse = ["collector", "warehouse-clickhouse", "culprit-store-clickhouse/write"]
recovery-azure = ["collector", "evidence-azure", "culprit-blob-azure/write"]
recovery-s3 = ["collector", "evidence-s3", "culprit-blob-s3/write"]
notify = ["evidence", "dep:culprit-notify", "dep:ureq"]
notify-slack = ["notify", "dep:culprit-notify-slack"]
notify-teams = ["notify", "dep:culprit-notify-teams"]
notify-pagerduty = ["notify", "dep:culprit-notify-pagerduty"]
notify-webhook = ["notify", "dep:culprit-notify-webhook"]
notify-github = ["notify", "dep:culprit-notify-github"]
notify-all = ["notify-slack", "notify-teams", "notify-pagerduty", "notify-webhook", "notify-github"]

# All of tests/ in one binary: each test binary is linked, and scanned on its first run, on its own.
[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
culprit-plans.workspace = true
culprit-cloud.workspace = true
culprit-read.workspace = true
culprit-auth.workspace = true
culprit-auth-aws = { workspace = true, optional = true }
culprit-auth-azure = { workspace = true, optional = true }
async-trait.workspace = true
zeroize.workspace = true
culprit-core.workspace = true
culprit-collector = { workspace = true, optional = true }
culprit-evidence = { workspace = true, optional = true }
culprit-store-adx = { workspace = true, optional = true, default-features = false }
culprit-blob-azure = { workspace = true, optional = true, default-features = false }
culprit-blob-s3 = { workspace = true, optional = true, default-features = false }
culprit-store-clickhouse = { workspace = true, optional = true, default-features = false }
culprit-checks.workspace = true
culprit-mssql = { workspace = true, optional = true }
culprit-postgres = { workspace = true, optional = true }
culprit-clickhouse = { workspace = true, optional = true }
culprit-yugabyte = { workspace = true, optional = true }
culprit-mysql = { workspace = true, optional = true }
culprit-sqlite = { workspace = true, optional = true }
culprit-notify = { workspace = true, optional = true }
culprit-notify-slack = { workspace = true, optional = true }
culprit-notify-teams = { workspace = true, optional = true }
culprit-notify-pagerduty = { workspace = true, optional = true }
culprit-notify-webhook = { workspace = true, optional = true }
culprit-notify-github = { workspace = true, optional = true }
culprit-querylog.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
keyring.workspace = true
process-wrap.workspace = true
ring.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util"] }
toml.workspace = true
ts-rs.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
culprit-evidence = { workspace = true, features = ["test-support"] }
culprit-collector = { workspace = true, features = ["test-support"] }
culprit-checks.workspace = true
proptest.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
