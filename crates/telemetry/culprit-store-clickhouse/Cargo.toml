[package]
name = "culprit-store-clickhouse"
description = "ClickHouse ingestion, SQL deployment and exact analytical readback"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
default = ["write"]
write = ["dep:culprit-collector"]

[dependencies]
culprit-evidence.workspace = true
culprit-core.workspace = true
culprit-collector = { workspace = true, optional = true }
async-trait.workspace = true
chrono.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
ureq.workspace = true
zeroize.workspace = true

[dev-dependencies]
culprit-evidence = { workspace = true, features = ["test-support"] }
culprit-collector = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
