[package]
name = "culprit-archive-web"
description = "Read-only telemetry archive web viewer without database drivers or collector credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false

[[bin]]
name = "culprit-archive-web"
path = "src/main.rs"

[features]
default = ["auth-azure", "auth-aws"]
auth-azure = ["culprit-engine/auth-azure"]
auth-aws = ["culprit-engine/auth-aws"]

[dependencies]
culprit-core.workspace = true
culprit-plans.workspace = true
culprit-read.workspace = true
culprit-evidence.workspace = true
culprit-auth.workspace = true
culprit-engine = { workspace = true, default-features = false, features = ["warehouse-adx", "evidence-azure", "warehouse-clickhouse", "evidence-s3"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }

[dev-dependencies]
culprit-evidence = { workspace = true, features = ["test-support"] }
