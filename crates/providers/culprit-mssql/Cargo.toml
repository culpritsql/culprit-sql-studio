[package]
name = "culprit-mssql"
description = "SQL Server provider for Culprit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Its doc comments hold no Rust examples: rustdoc would have nothing to test.
doctest = false

[features]
# Explicit owned actor fixture only; no Collector/Evidence dependency enters provider builds.
native-test-support = []

[dependencies]
culprit-plans.workspace = true
culprit-core.workspace = true
culprit-read.workspace = true
async-trait.workspace = true
chrono.workspace = true
flate2.workspace = true
futures-util.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
serde.workspace = true
tiberius = { workspace = true, features = ["tds80"] }
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
culprit-plans = { workspace = true, features = ["test-support"] }
culprit-evidence = { workspace = true, features = ["test-support"] }
culprit-checks.workspace = true
culprit-collector = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
