[package]
name = "culprit-mysql"
description = "MySQL provider for Culprit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Its doc comments hold no Rust examples: rustdoc would have nothing to test.
doctest = false

[features]
# Explicit owned-fixture composition only; absent from ordinary provider/desktop/MCP graphs.
native-test-support = ["dep:futures-util"]

[dependencies]
culprit-plans.workspace = true
culprit-core.workspace = true
culprit-read.workspace = true
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
mysql_async.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
culprit-evidence = { workspace = true, features = ["test-support"] }
culprit-collector.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
