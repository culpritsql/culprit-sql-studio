{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "culprit-collector.serviceAccountName" . }}
  labels:
    {{- include "culprit-collector.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.azureWorkloadIdentity.enabled }}
  annotations:
    {{- if .Values.azureWorkloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ .Values.azureWorkloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.azureWorkloadIdentity.tenantId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
