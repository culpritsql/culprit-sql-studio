apiVersion: v1
kind: Service
metadata:
  name: {{ include "culprit-collector.fullname" . }}
  labels:
    {{- include "culprit-collector.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "culprit-collector.selectorLabels" . | nindent 4 }}
  ports:
    - name: health
      port: 9098
      targetPort: health
